<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>純喫茶とレトロ建築</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru:wght@400;500&display=swap">
<style>
/* Layout: こげ茶の看板帯 → 絞り込みの箱 → 左にカード一覧、右に選んだ場所と近くのリスト。昭和の喫茶メニュー風、明るい単一テーマ */
:root{
  color-scheme:light;
  --bg:#fdf8f0; --box:#f3e9d7; --paper:#fffaf2; --brown:#4a2e2e; --brown-2:#6b4a44;
  --mustard:#e2a94a; --mustard-soft:#f8deaa; --muted:#7d6a62; --line:#d9cbb4;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
body{background:var(--bg);color:var(--brown);font-family:var(--body);font-size:15px;line-height:1.75}

.bar{background:var(--brown);color:var(--paper);border-bottom:8px solid #3a2222;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.bar-in,.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:16px;padding-block:18px}
.logo{flex:none;width:64px;height:64px;border-radius:50%;background:var(--mustard);border:3px solid var(--paper);display:grid;place-items:center;color:var(--brown)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.2;margin:0;letter-spacing:.08em}
.sub{margin:2px 0 0;font-size:14px;opacity:.85;letter-spacing:.05em}

.wrap{padding-block:28px 48px}
.box{background:var(--box);border:3px solid var(--brown);border-radius:22px;box-shadow:6px 6px 0 var(--brown)}
.filters{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.row .lb{font-family:var(--display);font-size:14px;min-width:5.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:6px 18px;border:2px solid var(--brown);border-radius:999px;background:var(--paper);font-size:14px;line-height:1.5}
.chip[aria-pressed="true"]{background:var(--brown);color:var(--paper)}
.chip:hover{background:var(--mustard-soft)} .chip[aria-pressed="true"]:hover{background:var(--brown-2)}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start;margin-top:30px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.listhead{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:14px;max-height:78vh;overflow:auto;padding:2px 10px 10px 2px}
@media (max-width:820px){.list{max-height:none}}

.tag{display:inline-block;font-family:var(--display);font-size:12px;padding:2px 10px;border-radius:6px;line-height:1.7}
.tag.kissa{background:var(--brown);color:var(--paper)}
.tag.arch{background:var(--mustard);color:var(--brown)}

.spot{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 18px;background:var(--box);border:2.5px solid var(--brown);border-radius:18px;box-shadow:4px 4px 0 var(--brown);transition:transform .12s,box-shadow .12s}
.spot:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--brown)}
.spot[aria-current="true"]{background:var(--mustard-soft)}
.spot .nm{grid-column:1/-1;font-family:var(--display);font-size:17px;line-height:1.4;min-width:0}
.spot .pl{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1.5px solid var(--line);padding-top:6px}
.spot .cnt{font-size:12px;border:2px solid var(--brown);border-radius:999px;padding:0 10px;white-space:nowrap;background:var(--paper)}

.panel{padding:26px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.panel{position:static;padding:20px}}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.35;margin:10px 0 4px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);margin:0}
.note{margin:10px 0 0;max-width:40em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-block;text-decoration:none;font-family:var(--display);font-size:13px;padding:6px 16px;border:2px solid var(--brown);border-radius:999px;background:var(--mustard);color:var(--brown);box-shadow:3px 3px 0 var(--brown)}
.btn:hover{background:#ebb85f}
a{color:inherit;text-underline-offset:3px}

.near{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;margin-top:22px;padding-top:20px;border-top:2px dashed var(--line);align-items:start}
@media (max-width:560px){.near{grid-template-columns:1fr}}
.near h3{grid-column:1/-1;margin:0;font-family:var(--display);font-weight:400;font-size:16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.near h3 .chip{padding:3px 14px;font-size:13px;font-family:var(--body)}
.rad{display:flex;gap:6px}
svg.map{width:100%;max-width:300px;height:auto;display:block;background:var(--paper);border:2px solid var(--brown);border-radius:16px}
.map text{font-family:var(--body);font-size:11px}
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.nlist li{display:grid;grid-template-columns:28px 1fr;gap:0 10px}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--brown)}
.num.kissa{background:var(--brown);color:var(--paper)} .num.arch{background:var(--mustard);color:var(--brown);border-radius:6px}
.nlist .nm{font-family:var(--display);font-size:15px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--mustard);text-decoration-thickness:2px;text-underline-offset:4px;background:none;border:0;padding:0;color:inherit;text-align:left}
.nlist .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px}
footer{margin-top:40px;font-size:12px;color:var(--muted);max-width:48em}
@media (prefers-reduced-motion: reduce){.spot{transition:none}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="logo" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/></svg>
    </div>
    <div>
      <h1>純喫茶とレトロ建築 🍒</h1>
      <p class="sub">ついでに寄れるお散歩帖</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="box filters">
    <div class="row">
      <span class="lb">☑ 探し方</span>
      <div class="chips" role="group" aria-label="探し方">
        <button class="chip" id="m-kissa" aria-pressed="true">☕ 純喫茶から</button>
        <button class="chip" id="m-arch" aria-pressed="false">🏛 建物から</button>
      </div>
    </div>
    <div class="row">
      <span class="lb">📍 エリア</span>
      <div class="chips" id="areas" role="group" aria-label="エリア"></div>
    </div>
  </div>

  <div class="grid">
    <div>
      <p class="listhead" id="listhead"></p>
      <div class="list" id="list"></div>
    </div>
    <section class="box panel" id="panel" aria-live="polite"></section>
  </div>

  <footer>
    位置はおおよその座標で、距離は直線距離をもとにした目安です（徒歩は道のりを直線の1.25倍、分速80mで計算）。休業・閉店や営業時間の変更があるので、出かける前に各店・各施設の情報を確認してください。
  </footer>
</div>

 {t:"arch",n:"京都府庁 旧本館",a:"京都",p:"西洞院",y:1904,by:"松室重光",lat:35.0217,lng:135.7557,d:"現役の府庁舎として日本最古級。旧議場と中庭を見学できる。重要文化財。"},
 {t:"arch",n:"京都大学 百周年時計台記念館",a:"京都",p:"吉田",y:1925,by:"武田五一",lat:35.0262,lng:135.7808,d:"京大の顔。登録有形文化財。"},
 {t:"arch",n:"長楽館",a:"京都",p:"円山公園",y:1909,by:"J.M.ガーディナー",lat:35.0037,lng:135.7812,d:"煙草王・村井吉兵衛の迎賓館。今もカフェとして入れる。"},
 {t:"arch",n:"京都市京セラ美術館",a:"京都",p:"岡崎",y:1933,by:"前田健二郎（原案）",lat:35.0126,lng:135.7826,d:"帝冠様式の美術館。2020年のリニューアルでガラスの入口が加わった。"},
 {t:"arch",n:"船岡温泉",a:"京都",p:"紫野",y:1923,lat:35.0367,lng:135.7432,d:"脱衣所の欄間に精巧な木彫り、マジョリカタイル。登録有形文化財の銭湯。"},

 // ---- 大阪 ----
 {t:"kissa",n:"純喫茶アメリカン",a:"大阪",p:"道頓堀",y:1946,lat:34.6686,lng:135.5017,d:"螺旋階段とシャンデリアの豪華な空間。ホットケーキとサンドイッチ。"},

 {t:"kissa",n:"マヅラ",a:"大阪",p:"梅田",y:1970,lat:34.6997,lng:135.4975,d:"大阪駅前第1ビル地下の宇宙船のような空間。昭和の未来感が全開。"},
 {t:"arch",n:"大阪市中央公会堂",a:"大阪",p:"中之島",y:1918,by:"岡田信一郎（原案）・辰野片岡事務所",lat:34.6926,lng:135.5042,d:"赤煉瓦と青銅のドーム。地下のレストランもレトロ。重要文化財。"},
 {t:"arch",n:"大阪府立中之島図書館",a:"大阪",p:"中之島",y:1904,by:"野口孫市",lat:34.6932,lng:135.5026,d:"ドームと列柱のネオ・バロック。現役の図書館。重要文化財。"},
 {t:"arch",n:"北浜レトロビル",a:"大阪",p:"北浜",y:1912,lat:34.6916,lng:135.5071,d:"明治の株仲買商の社屋。英国式ティールームとして営業。登録有形文化財。"},
 {t:"arch",n:"綿業会館",a:"大阪",p:"備後町",y:1931,by:"渡辺節",lat:34.6856,lng:135.5047,d:"部屋ごとに様式の違う豪華な内装。見学日あり。重要文化財。"},
 {t:"arch",n:"芝川ビル",a:"大阪",p:"伏見町",y:1927,by:"渋谷五郎・本間乙彦",lat:34.6873,lng:135.5040,d:"マヤ・インカ風の装飾が珍しいビル。登録有形文化財。"},
 {t:"arch",n:"生駒ビルヂング",a:"大阪",p:"平野町",y:1930,by:"宗兵蔵",lat:34.6873,lng:135.5062,d:"時計塔と鷲の彫刻が目印のアール・デコ。登録有形文化財。"},
 {t:"arch",n:"大丸心斎橋店 本館",a:"大阪",p:"心斎橋",y:1933,by:"W.M.ヴォーリズ",lat:34.6728,lng:135.5011,d:"2019年の建替えで外観と装飾を保存・復元。"},
 {t:"arch",n:"高島屋大阪店（南海ビル）",a:"大阪",p:"難波",y:1932,by:"久野節",lat:34.6652,lng:135.5018,d:"列柱が連なる南海なんば駅の駅ビル。登録有形文化財。"},
].map((s,i)=>({...s,id:i}));

const AREAS=["すべて","東京","京都","大阪"];
const LABEL={kissa:"純喫茶",arch:"レトロ建築"};
const SHORT={kissa:"純喫茶",arch:"建物"};
const TAG={kissa:`<span class="tag kissa">☕ 純喫茶</span>`,arch:`<span class="tag arch">🏛 建物</span>`};
const other=t=>t==="kissa"?"arch":"kissa";
const st={mode:"kissa",area:"すべて",sel:null,r:1000};
try{const v=JSON.parse(localStorage.getItem("kr-state")||"{}");if(v.r)st.r=v.r;if(AREAS.includes(v.area))st.area=v.area;}catch(e){}
const save=()=>{try{localStorage.setItem("kr-state",JSON.stringify({r:st.r,area:st.area}))}catch(e){}};

function dist(a,b){const R=6371000,toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
const fmtD=m=>m<1000?`${Math.round(m/10)*10}m`:`${(m/1000).toFixed(1)}km`;
const walk=m=>`徒歩約${Math.max(1,Math.round(m*1.25/80))}分`; // 直線距離×1.25を道のりの目安に
const gq=s=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n+" "+s.p)}`;
const gdir=(a,b)=>`https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${encodeURIComponent(b.n+" "+b.p)}&travelmode=walking`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nearOf=(s,r)=>S.filter(x=>x.t===other(s.t)&&x.a===s.a).map(x=>({...x,m:dist(s,x)})).sort((p,q)=>p.m-q.m).filter(x=>x.m<=r);

function renderControls(){
  document.getElementById("m-kissa").setAttribute("aria-pressed",st.mode==="kissa");
  document.getElementById("m-arch").setAttribute("aria-pressed",st.mode==="arch");
  document.getElementById("areas").innerHTML=AREAS.map(a=>`<button class="chip" data-a="${a}" aria-pressed="${a===st.area}">${a}</button>`).join("");
}
function renderList(){
  const items=S.filter(s=>s.t===st.mode&&(st.area==="すべて"||s.a===st.area));
  if(!items.some(s=>s.id===st.sel))st.sel=items[0]?.id??null;
  document.getElementById("listhead").textContent=`${LABEL[st.mode]} ${items.length}件 ・ 右の数字は${fmtD(st.r)}以内の${LABEL[other(st.mode)]}`;
  document.getElementById("list").innerHTML=items.map(s=>{
    const c=nearOf(s,st.r).length;
    return `<button class="spot ${s.t}" data-id="${s.id}" aria-current="${s.id===st.sel}">
      <span>${TAG[s.t]}</span><span class="cnt">${c?`近くの${SHORT[other(s.t)]} ${c}件`:`近くの${SHORT[other(s.t)]}なし`}</span>
      <span class="nm">${esc(s.n)}</span>
      <span class="pl">${s.a}・${esc(s.p)}${s.y?` ／ ${s.y}年`:""}</span></button>`}).join("");
}
function mapSVG(s,near){
  const W=300,C=150,R=128,toM={y:110540,x:111320*Math.cos(s.lat*Math.PI/180)};
  const xy=p=>{const dx=(p.lng-s.lng)*toM.x,dy=(p.lat-s.lat)*toM.y;return[C+dx/st.r*R,C-dy/st.r*R]};
  const o=other(s.t);
  let g=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="${C}" cy="${C}" r="${R/2}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${C+R/2*0.71+4}" y="${C+R/2*0.71+12}" fill="var(--muted)">${fmtD(st.r/2)}</text>
    <text x="${C+R*0.71+4}" y="${C+R*0.71+12}" fill="var(--muted)">${fmtD(st.r)}</text>
    <text x="${C}" y="14" fill="var(--muted)" text-anchor="middle">N ↑</text>`;
  near.forEach((p,i)=>{const[x,y]=xy(p);
    g+=o==="kissa"?`<circle cx="${x}" cy="${y}" r="10" fill="var(--brown)"/>`:`<rect x="${x-10}" y="${y-10}" width="20" height="20" rx="4" fill="var(--mustard)" stroke="var(--brown)" stroke-width="2"/>`;
    g+=`<text x="${x}" y="${y+4}" text-anchor="middle" fill="${o==="kissa"?"var(--paper)":"var(--brown)"}" font-weight="700">${i+1}</text>`});
  g+=s.t==="kissa"?`<circle cx="${C}" cy="${C}" r="12" fill="var(--mustard-soft)" stroke="var(--brown)" stroke-width="4"/><text x="${C}" y="${C+5}" text-anchor="middle" font-size="13">☕</text>`:`<rect x="${C-12}" y="${C-12}" width="24" height="24" rx="4" fill="var(--mustard-soft)" stroke="var(--brown)" stroke-width="4"/><text x="${C}" y="${C+5}" text-anchor="middle" font-size="13">🏛</text>`;
  return `<svg class="map" viewBox="0 0 ${W} ${W}" role="img" aria-label="${esc(s.n)}を中心とした${fmtD(st.r)}圏の位置関係"><rect width="${W}" height="${W}" fill="none"/>${g}</svg>`;
}
function renderPanel(){
  const el=document.getElementById("panel");const s=S.find(x=>x.id===st.sel);
  if(!s){el.innerHTML=`<p class="empty">このエリアには登録がありません。</p>`;return}
  const o=other(s.t),near=nearOf(s,st.r);
  const all=S.filter(x=>x.t===o&&x.a===s.a).map(x=>({...x,m:dist(s,x)})).sort((p,q)=>p.m-q.m);
  el.innerHTML=`
    ${TAG[s.t]}
    <h2>${esc(s.n)}</h2>
    <p class="meta">${s.a}・${esc(s.p)}${s.y?` ／ ${s.t==="kissa"?"創業":"竣工"} ${s.y}年`:""}${s.by?` ／ 設計 ${esc(s.by)}`:""}</p>
    <p class="note">${esc(s.d)}</p>
    <div class="links"><a class="btn" href="${gq(s)}" target="_blank" rel="noopener">Googleマップで開く ↗</a></div>
    <div class="near">
      <h3><span>近くの${SHORT[o]}</span>
        <span class="rad" role="group" aria-label="半径">${[500,1000,2000].map(r=>`<button class="chip" data-r="${r}" aria-pressed="${r===st.r}">${fmtD(r)}</button>`).join("")}</span></h3>
      ${mapSVG(s,near)}
      ${near.length?`<ol class="nlist">${near.map((p,i)=>`<li><span class="num ${o}">${i+1}</span><div>
          <button class="nm" data-jump="${p.id}">${esc(p.n)}</button>
          <div class="d">${fmtD(p.m)} ・ ${walk(p.m)}${p.y?` ・ ${p.y}年`:""}</div>
          <div class="d"><a href="${gdir(s,p)}" target="_blank" rel="noopener">ここから歩くルート ↗</a></div></div></li>`).join("")}</ol>`
        :`<p class="empty">${fmtD(st.r)}以内には登録がありません。${all[0]?`いちばん近いのは「${esc(all[0].n)}」（${fmtD(all[0].m)}）です。`:""}</p>`}
    </div>`;
}
function render(){renderControls();renderList();renderPanel()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="m-kissa"||b.id==="m-arch"){st.mode=b.id.slice(2);st.sel=null;render();return}
  if(b.dataset.a){st.area=b.dataset.a;st.sel=null;save();render();return}
  if(b.dataset.r){st.r=+b.dataset.r;save();renderList();renderPanel();return}
  if(b.dataset.id){st.sel=+b.dataset.id;renderList();renderPanel();
    if(matchMedia("(max-width:820px)").matches)document.getElementById("panel").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(b.dataset.jump){const t=S[+b.dataset.jump];st.mode=t.t;st.area=st.area==="すべて"?"すべて":t.a;st.sel=t.id;render();
    document.querySelector(`.spot[data-id="${t.id}"]`)?.scrollIntoView({block:"nearest"});}
});
render();
</script>

</body>
</html>
